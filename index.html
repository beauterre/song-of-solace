const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const masterGain = audioCtx.createGain();
masterGain.gain.value = 0.15; // overall volume
masterGain.connect(audioCtx.destination);

// --- Gradient-descent tuning ---
const idealRatios = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8];

function resonanceCost(f, others) {
  let cost = 0;
  for (let o of others) {
    if (o === f) continue;
    let ratio = f / o;
    let bestDiff = Infinity;
    for (let r of idealRatios) {
      let diff = Math.min(Math.abs(ratio - r), Math.abs(ratio - 1/r));
      if (diff < bestDiff) bestDiff = diff;
    }
    cost += bestDiff * bestDiff;
  }
  return cost;
}

function tuneFrequencies(freqs, iterations = 3, stepSize = 0.5) {
  let tuned = freqs.slice();
  for (let it = 0; it < iterations; it++) {
    let newFreqs = tuned.slice();
    for (let i = 0; i < tuned.length; i++) {
      const others = tuned.filter((_, j) => j !== i);
      const current = tuned[i];
      const costCurrent = resonanceCost(current, others);
      const costUp = resonanceCost(current + stepSize, others);
      const costDown = resonanceCost(current - stepSize, others);
      if (costUp < costCurrent && costUp < costDown) newFreqs[i] += stepSize;
      else if (costDown < costCurrent && costDown < costUp) newFreqs[i] -= stepSize;
    }
    tuned = newFreqs;
  }
  return tuned;
}

// --- MIDI to frequency ---
function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

// --- Play a single note ---
function playNote(freq, dur = 1.0) {
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  const env = audioCtx.createGain();
  env.gain.setValueAtTime(0, audioCtx.currentTime);
  env.gain.linearRampToValueAtTime(0.3+0.2*Math.random(), audioCtx.currentTime + 0.02);
  env.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime + 1);
  env.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
  osc.connect(env).connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  var r=1+8*Math.random();
  r=Math.floor(r)/2;
  osc2.frequency.value = freq+r;
  const env2 = audioCtx.createGain();
  env2.gain.setValueAtTime(0, audioCtx.currentTime);
  env2.gain.linearRampToValueAtTime(0.4+0.1*Math.random(), audioCtx.currentTime + 0.02);
  env2.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime + 1);
  env2.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
  osc2.connect(env2).connect(masterGain);
  osc2.start();
  osc2.stop(audioCtx.currentTime + dur);
}

// --- Play progression as evolving arpeggio ---
let currentChord = 0;
function playStep() {
  const chord = chordProg[currentChord].map(midiToFreq);
  const tuned = tuneFrequencies(chord, 4, 0.3); // gradient-descent adjustment
  const tempo=800;
  // arpeggiate slowly
  tuned.forEach((f, i) => {
    setTimeout(() => playNote(f, 3*tempo/1000), i * tempo+Math.random()*tempo*0.15);// humanised..
  });
  currentChord = (currentChord + 1) % chordProg.length;
  setTimeout(playStep, tempo*2); // slow 1 sec per chord base
}
